services:
  postgres:
    image: postgres:17
    container_name: neptune-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neptune

    ports:
      - "5433:5433"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: