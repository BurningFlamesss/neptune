services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: neptune-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neptune

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  laya:
    build:
      context: .
      dockerfile: Dockerfile.laya
    container_name: neptune-laya
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - PYTHONUNBUFFERED=1
      - LAYA_HOST=0.0.0.0
      - LAYA_PORT=8787
      - LAYA_THREADS=4
      - LAYA_MODELS=english,typed-decisions
      - LAYA_AUTO_TASK=1
      - HF_HOME=/models
    volumes:
      - laya_models:/models

volumes:
  postgres_data:
  laya_models: